#
# Cuts a release when a v* tag is pushed: cross-compiles the binaries, archives
# them with the license bundle, and drafts a GitHub release whose notes are the
# matching CHANGELOG.md section. See .goreleaser.yaml.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release and upload artifacts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history and tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Extract this tag's CHANGELOG section
        # Pull the "## [x.y.z]" block for the pushed tag into notes.md, so the
        # hand-written changelog is the release body verbatim. A prerelease tag
        # (e.g. v0.5.0-rc.1) has no section of its own, so strip the suffix and
        # use the base release's notes. Fails loudly if even that has no section,
        # rather than shipping an empty release. Written under RUNNER_TEMP, not the
        # working tree, so goreleaser's dirty-state check does not see it.
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="${version%%-*}"
          notes="${RUNNER_TEMP}/notes.md"
          awk -v v="$base" '
            $0 ~ "^## \\[" v "\\]" { grab=1; next }
            grab && /^## \[/       { exit }
            grab                   { print }
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error::no CHANGELOG.md section for $base"; exit 1
          fi
          echo "----- release notes ($base) -----"; cat "$notes"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - misspell
    - revive
    - unconvert
  exclusions:
    # Standard errcheck exclusions (fmt.Fprint*, Flush, Close, os.Remove): the
    # error that matters on each write path is checked explicitly.
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
